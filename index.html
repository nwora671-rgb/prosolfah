<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120d1c"><title>ProSolfah V3</title><link rel="stylesheet" href="style.css">
</head><body>
<header><div class="brand"><img src="assets/logo.png"><div><b>ProSolfah</b><small>Sing • Learn • Worship</small></div></div><button id="theme">☼</button></header>
<main>
<section class="hero"><p>TONIC SOL-FA HYMN LIBRARY</p><h1>Find your hymn.<br><em>Learn the sol-fa.</em></h1>
<div class="search">⌕ <input id="q" placeholder="Search title, number, or author..."></div></section>
<section class="filters"><button class="active" data-filter="all">All</button><button data-filter="notation">With Sol-fa</button><button data-filter="favorites">Favorites</button></section>
<section class="library"><div class="head"><h2>ProSolfah Library</h2><span id="count"></span></div><div id="list"></div></section>
</main>
<nav><button>⌂<small>Home</small></button><button class="on">♫<small>Hymns</small></button><button id="favNav">☆<small>Favorites</small></button></nav>
<div id="reader" class="overlay"><div class="reader"><button class="x" onclick="closeReader()">×</button>
<div class="readerTop"><div><p>HYMN READER</p><h2 id="rt"></h2><small id="rm"></small></div><button id="favBtn" class="star">☆</button></div>
<div class="tools"><label>Speed <select id="speed"><option value="0.7">0.7×</option><option value="1" selected>1×</option><option value="1.3">1.3×</option></select></label><button id="stop">■ Stop</button></div>
<div id="sections"></div>
<div class="notice">🎼 Only the sol-fa supplied or verified for this hymn is shown. Missing notation is left blank instead of being guessed.</div>
</div></div>
<script src="app.js"></script></body></html>
